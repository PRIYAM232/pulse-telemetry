# otelcol-pulse config for the sandbox — the production pipeline shape from
# deploy/docker/otelcol-docker.yaml (otlp → pulse_filter → routing → hot/cold)
# with the hot pipelines terminating in real backends instead of `debug`:
#
#   traces/hot  → Jaeger             (otlp_grpc)
#   logs/hot    → mock-log-backend   (otlp_grpc)
#   metrics/hot → Prometheus         (otlp_http, native OTLP receiver)
#
# cold-storage stays on `debug`, so ROUTE rules still work in the sandbox.
# Fleet ID and key are the deterministic LOCAL DEV values from
# control-plane/prisma/seed.ts.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  pulse_filter:
    log_span_details: false
    sync_endpoint: http://control-plane:3000/api/v1/policies/f1ee7000-0000-4000-8000-000000000001
    # Tighter than the 10s dev default so a rule saved in the dashboard is
    # enforced within ~5s. This is the only knob bounding "instantly".
    sync_interval: 5s
    stats_endpoint: http://control-plane:3000/api/v1/telemetry/f1ee7000-0000-4000-8000-000000000001/stats
    stats_interval: 10s
    fleet_key: pulse_dev_sk_2f7d1b9c4e8a4f60b3d5a9c1e6f80712

connectors:
  routing/traces:
    default_pipelines: [traces/hot]
    table:
      - context: resource
        condition: attributes["pulse.routing.destination"] == "cold-storage"
        pipelines: [traces/cold]
  routing/logs:
    default_pipelines: [logs/hot]
    table:
      - context: resource
        condition: attributes["pulse.routing.destination"] == "cold-storage"
        pipelines: [logs/cold]
  routing/metrics:
    default_pipelines: [metrics/hot]
    table:
      - context: resource
        condition: attributes["pulse.routing.destination"] == "cold-storage"
        pipelines: [metrics/cold]

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  otlp_grpc/log-backend:
    endpoint: mock-log-backend:4317
    tls:
      insecure: true
  otlp_http/prometheus:
    metrics_endpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
  debug/cold:
    verbosity: basic

service:
  telemetry:
    logs:
      # info, not debug: pulse_filter logs every batch at debug, which at the
      # sandbox's noisy rate would bury the "ruleset updated" lines the
      # runbook greps for.
      level: info
    metrics:
      # Scraped by the sandbox Prometheus. 0.0.0.0 so it is reachable over
      # the compose network; the without_* flags keep the classic metric
      # names (otelcol_pulse_filter_logs_dropped, no _total suffix).
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_scope_info: true
                without_type_suffix: true
                without_units: true
  pipelines:
    traces/in:
      receivers: [otlp]
      processors: [pulse_filter]
      exporters: [routing/traces]
    logs/in:
      receivers: [otlp]
      processors: [pulse_filter]
      exporters: [routing/logs]
    metrics/in:
      receivers: [otlp]
      processors: [pulse_filter]
      exporters: [routing/metrics]

    traces/hot:
      receivers: [routing/traces]
      exporters: [otlp_grpc/jaeger]
    traces/cold:
      receivers: [routing/traces]
      exporters: [debug/cold]
    logs/hot:
      receivers: [routing/logs]
      exporters: [otlp_grpc/log-backend]
    logs/cold:
      receivers: [routing/logs]
      exporters: [debug/cold]
    metrics/hot:
      receivers: [routing/metrics]
      exporters: [otlp_http/prometheus]
    metrics/cold:
      receivers: [routing/metrics]
      exporters: [debug/cold]
