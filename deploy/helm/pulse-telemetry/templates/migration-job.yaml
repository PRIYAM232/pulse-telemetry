# One-shot Prisma migrate + seed — the K8s twin of compose's
# control-plane-migrate service, running the control-plane Dockerfile's
# `builder` stage (the only image with the Prisma CLI).
#
# Hook timing — post-install + pre-upgrade, NOT pre-install:
#   * pre-install hooks run before ANY release resource exists, so on first
#     install there would be no postgres StatefulSet/Service to migrate
#     against — the job could never connect. post-install runs after the
#     release objects are applied; the wait-for-postgres initContainer rides
#     out the database's first boot, and the control plane simply stays
#     unready (readiness probe) until tables and seed data land.
#   * pre-upgrade preserves the guarantee that matters for upgrades:
#     migrations run to completion BEFORE the new app pods roll out.
#
# DATABASE_URL is rendered inline from the same helper the secret uses,
# rather than referencing the secret: during a pre-upgrade hook the cluster
# still holds the previous release's secret, and migrations must target the
# URL this upgrade is installing.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels:
    app.kubernetes.io/name: pulse-migrate
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: migrator
    {{- include "pulse-telemetry.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "1"
    # before-hook-creation (only): the next install/upgrade replaces any
    # leftover job, but the finished job sticks around so
    # `kubectl logs job/{{ .Release.Name }}-migrate` shows the migrate+seed
    # output after the fact.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.migrator.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrator.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulse-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrator
    spec:
      restartPolicy: Never
      initContainers:
        # pg_isready needs no credentials — it only checks the server is
        # accepting connections — and understands a conninfo URL via -d.
        # The query string must be stripped first: `?schema=public` is a
        # Prisma-ism that libpq rejects as an invalid URI parameter.
        - name: wait-for-postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              until pg_isready -d "${DATABASE_URL%%\?*}"; do
                echo "waiting for postgres..."
                sleep 2
              done
          env:
            - name: DATABASE_URL
              value: {{ include "pulse-telemetry.databaseUrl" . | quote }}
      containers:
        - name: migrate
          image: "{{ .Values.migrator.image.repository }}:{{ .Values.migrator.image.tag }}"
          imagePullPolicy: {{ .Values.migrator.image.pullPolicy }}
          command:
            - sh
            - -c
            - npx prisma migrate deploy{{ if .Values.migrator.seed }} && npx prisma db seed{{ end }}
          env:
            - name: DATABASE_URL
              value: {{ include "pulse-telemetry.databaseUrl" . | quote }}
