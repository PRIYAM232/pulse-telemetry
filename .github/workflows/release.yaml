# Pulse release — artifact publishing on version tags (v1.0.0, v1.2.3-rc.1).
#
# Publishes to GitHub Container Registry under this repository's namespace:
#   ghcr.io/<owner>/<repo>/control-plane          (Dockerfile `runner` stage)
#   ghcr.io/<owner>/<repo>/control-plane-migrate  (Dockerfile `builder` stage —
#                                                  the Prisma CLI + migrations
#                                                  image the chart's hook Job runs)
#   ghcr.io/<owner>/<repo>/otelcol-pulse          (custom collector distro)
#   oci://ghcr.io/<owner>/charts/pulse-telemetry  (Helm chart, OCI registry)
#
# Auth is the workflow's own GITHUB_TOKEN via `packages: write` — no PAT to
# provision or rotate. Images are tagged with the full semver, the minor
# line (1.2), and latest; the chart version/appVersion are stamped from the
# tag (Helm semver forbids the leading `v`).
#
# Supply-chain gate: every image is built locally and scanned by Trivy for
# CRITICAL CVEs BEFORE anything is pushed — a vulnerable image never gets a
# GHCR tag, not even transiently. The push step re-runs the same build and
# resolves as a pure buildx cache hit.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: ${{ matrix.image }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: control-plane
            context: control-plane
            dockerfile: control-plane/Dockerfile
            target: runner
          - image: control-plane-migrate
            context: control-plane
            dockerfile: control-plane/Dockerfile
            target: builder
          - image: otelcol-pulse
            # The collector Dockerfile copies data-plane/ from the repo root.
            context: .
            dockerfile: deploy/docker/Dockerfile.collector
            target: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        # metadata-action lowercases the repository path for us (GHCR
        # requires lowercase image names).
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          # `latest` rides along automatically for non-prerelease semver tags
          # (flavor latest=auto), so an rc tag never captures it.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build locally first (load: true, no push) so Trivy can gate the
      # image before any tag reaches the registry.
      - name: Build image (local only)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: pulse-scan/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # Pinned to the v0.36.0 commit SHA, not the tag: trivy-action's mutable
      # tags (0.0.1–0.34.2) were compromised via imposter commits in March
      # 2026. SHA pins are immutable; bump them deliberately.
      - name: Gate release on CRITICAL CVEs (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pulse-scan/${{ matrix.image }}:${{ github.sha }}
          format: table
          # CVE gate only. Trivy's secret scanner would flag the deterministic
          # dev fleet key baked into the collector's default config.
          scanners: vuln
          severity: CRITICAL
          # Unfixed CRITICALs fail too (no ignore-unfixed): swapping the base
          # image or a reasoned .trivyignore entry are the only ways past.
          exit-code: "1"

      # Identical context/target/cache as the local build above, so this is a
      # cache hit — no second compile, just tag + push of the scanned layers.
      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  helm-chart:
    name: Helm chart (OCI)
    runs-on: ubuntu-latest
    # Publish the chart only once every image it references exists.
    needs: images
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Log in to GHCR (Helm)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Package and push chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          helm package deploy/helm/pulse-telemetry \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination dist/
          helm push "dist/pulse-telemetry-${VERSION}.tgz" "oci://${REGISTRY}/${OWNER}/charts"
